<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Test</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Times New Roman", serif;
    }

    /* ---------- Navigation ---------- */
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      background-color: #333;
    }

    nav a {
      display: block;
      color: #fff;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }

    nav a:hover { background-color: #111; }

    /* ---------- Header (image + title) ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background-color: powderblue;
    }

    header img {
      width: 20%;
      min-width: 80px;
      max-width: 200px;
      height: auto;
      border: 5px solid #333;
    }

    header h1 {
      margin: 0;
      font-family: Verdana, sans-serif;
      font-size: 60px;
      font-style: italic;
      color: purple;
    }

    /* ---------- Boxes ---------- */
    .container {
      display: flex;
      gap: 8px;
      padding: 8px;
    }

    .box {
      flex: 1;
      padding: 30px;
      background-color: lightblue;
      color: blue;
      text-decoration: none;
      font-size: 40px;
      text-align: center;
    }

    .box:hover { color: red; }

    @media (max-width: 1200px) {
      .container { flex-direction: column; }
    }

    /* ---------- Iframe ---------- */
    .frame-wrap {
      padding: 8px;
    }

    .frame-wrap iframe {
      display: block;
      width: 100%;
      max-width: 900px;
      height: 80vh;
      margin: 0 auto;
      border: 1px solid #ccc;
    }

    .footer {
   position: fixed;
   left: 0;
   bottom: 0;
   width: 100%;
   background-color: rgb(255, 0, 195);
   color: white;
   text-align: center;
    }

    </style>
</head>

<body>
  <a id="top"></a>

  <nav>
    <ul>
      <li><a href="https://www.utech.edu.jm/">Home</a></li>
      <li><a href="https://www.yahoo.com/news/">News</a></li>
      <li><a href="https://weather.com/?Goto=Redirected">Weather</a></li>
    </ul>
  </nav>

  <header>
    <img src="IMG.jpg" alt="Image not found">
    <h1>Shantelle's First Responsive Webpage Design</h1>
  </header>

  <div class="container">
    <a class="box" href="https://www.utech.edu.jm/" target="_blank" rel="noopener">
      &#127891; My School
    </a>

    <a class="box" href="https://www.utech.edu.jm/academics/faculty-of-engineering-and-computing/" target="_blank" rel="noopener">
      &#127979; My Faculty
    </a>

    <a class="box" href="mailto:shantelledyoung@students.utech.edu.jm">
      &#128222; Contact
    </a>
  </div>

  <div class="frame-wrap">
    <iframe name="frm"
            src="Quote.jpg"
            title="CIT2011 Developer Tools Practical Lab">
      Document not found
    </iframe>
  </div>
<div class="footer">
  <p> Created by Shantelle Young &#169; </p>
</div>

</body>
</html>
